 b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(e=>e.classList.remove('on'));b.classList.add('on');d.classList.add('on');LS.set('tab',i)}});
const lt=LS.get('tab',0);if(lt&&tabs.children[lt])tabs.children[lt].click();
document.addEventListener('click',e=>{const b=e.target.closest('button.cp[data-t]');if(b)copy(b,b.dataset.t)});
['#tc','#tg','#tm','#tk','#tp'].forEach(s=>{const t=$(s);if(t)sortable(t)});
function filt(inp,tb){$(inp).oninput=e=>{const q=e.target.value.toLowerCase();$(tb).querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}}
filt('#kf','#tk');filt('#mf','#tm');
// публикации
const pub=LS.get('pub',{});const upPub=()=>$('#pubc').textContent=Object.values(pub).filter(Boolean).length;
document.querySelectorAll('.pub').forEach(c=>{c.checked=!!pub[c.dataset.n];c.onchange=()=>{pub[c.dataset.n]=c.checked;LS.set('pub',pub);upPub()}});upPub();
// план
const pl=LS.get('plan',{});const upPl=()=>{const n=Object.values(pl).filter(Boolean).length;$('#pp').innerHTML=`Выполнено <b>${n}</b> из ${D.plan.length}`;$('#ppb').style.width=n/D.plan.length*100+'%';
 document.querySelectorAll('#tp tbody tr').forEach(r=>r.classList.toggle('done',!!pl[r.dataset.i]))};
document.querySelectorAll('.pl').forEach(c=>{c.checked=!!pl[c.dataset.i];c.onchange=()=>{pl[c.dataset.i]=c.checked;LS.set('plan',pl);upPl()}});upPl();
// трекинг
let tr=LS.get('track',null)||[{d:'06.10',v:me.views,c:me.contacts,r:me.reviews,g:me.rating,s:me.spend}];
function drawT(){$('#tt tbody').innerHTML=tr.map((x,i)=>`<tr><td>${x.d}</td><td>${x.v}</td><td>${x.c}</td><td>${x.v?pct(x.c/x.v):'—'}</td><td>${x.r}</td><td>${x.g}</td><td>${fmt(x.s)}₽</td><td>${x.c?Math.round(x.s/x.c)+'₽':'—'}</td><td>${i?`<button class="cp" data-del="${i}" data-l="✕">✕</button>`:''}</td></tr>`).join('');
 $('#tch').innerHTML=bars(tr.map(x=>[x.d,x.v]).concat([['🎯 цель',T.views,'#1f9d55']]));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{tr.splice(+b.dataset.del,1);LS.set('track',tr);drawT()})}
$('#t_add').onclick=()=>{const g=id=>parseFloat($(id).value)||0;if(!$('#t_d').value)return alert('Укажи дату');tr.push({d:$('#t_d').value,v:g('#t_v'),c:g('#t_c'),r:g('#t_r'),g:g('#t_g'),s:g('#t_s')});LS.set('track',tr);drawT();
 ['#t_d','#t_v','#t_c','#t_r','#t_g','#t_s'].forEach(i=>$(i).value='')};drawT();
</script></body></html>
