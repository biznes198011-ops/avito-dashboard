<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мужской Гардероб — рабочий дашборд</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1b2230; --line:#242c3a;
    --text:#e6edf3; --muted:#8b96a5; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --violet:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:19px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--panel);white-space:nowrap}
  .chip b{color:var(--text)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  nav{display:flex;gap:4px;padding:10px 22px 0;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  nav button{background:none;border:0;color:var(--muted);padding:9px 13px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent}
  nav button:hover{color:var(--text)}
  nav button.on{color:var(--text);border-bottom-color:var(--accent)}
  main{padding:18px 22px 60px}
  section{display:none}
  section.on{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .v{font-size:23px;font-weight:650;margin-top:3px}
  .kpi .l{color:var(--muted);font-size:12px}
  .kpi .h{font-size:11px;color:var(--muted);margin-top:5px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .bar-row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}
  .bar{height:16px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#2f6df6,#4f8cff)}
  .bar span{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;color:#cfe0ff}
  .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
  td{padding:9px 8px;border-bottom:1px solid #1f2634;vertical-align:top}
  tr.row:hover{background:#1a2130}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
  .tag.ok{color:var(--ok);border-color:#24462c;background:#122417}
  .tag.warn{color:var(--warn);border-color:#4a3a15;background:#241c0d}
  .tag.bad{color:var(--bad);border-color:#5a2222;background:#2a1414}
  .tag.info{color:var(--violet);border-color:#3b2a5a;background:#1d1630}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input[type=search],select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;min-width:150px}
  input[type=search]{flex:1;min-width:220px}
  button.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px}
  button.btn:hover{border-color:#3a4a63}
  button.btn.pri{background:#1b2f55;border-color:#2f5bb8}
  .issues{margin:6px 0 0;padding-left:16px;color:#c7d2dd}
  .issues li{margin:2px 0}
  .fix{color:#9ef0b0}
  details summary{cursor:pointer;color:var(--accent);font-size:12px}
  .donut{width:132px;height:132px;border-radius:50%;margin:4px auto;display:grid;place-items:center;position:relative}
  .donut::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--panel)}
  .donut b{position:relative;z-index:2;font-size:20px}
  .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .hint{color:var(--muted);font-size:12px;margin:6px 0 0}
  .score{font-weight:650}
  .s-B{color:var(--ok)} .s-C{color:var(--warn)} .s-D{color:var(--bad)}
  .p-P1{color:var(--bad)} .p-P2{color:var(--warn)} .p-P3{color:var(--muted)}
  .tasks{display:grid;gap:8px}
  .task{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .task input{margin-top:3px;accent-color:var(--accent)}
  .task.done .t{opacity:.45;text-decoration:line-through}
  .task .t{font-weight:550}
  .task .d{color:var(--muted);font-size:12px;margin-top:2px}
  code{background:#0b1017;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px;color:#9ad1ff}
  .copy{cursor:pointer;float:right;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel2)}
  .copy:hover{color:var(--text)}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .lead{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .cols2{columns:2;column-gap:26px}
  @media(max-width:900px){.cols2{columns:1}}
</style>
</head>

(function(){

    ['dups','Убрать дубли по фото/артикулу','014 и 028 — один артикул 134381. Плюс группы одинаковых заголовков: '+(Object.keys(D.dups||{}).length)+' шт.'],
    ['titles','Переписать заголовки по плану','58 новых заголовков уже в _titles_plan.json: подкатегория + цвет + размер, до 50 символов.'],
    ['desc','Описания до 800–1500 знаков','Сейчас среднее '+(D.kpi.desc_avg||0)+' знака. Добавить состав, утеплитель, температуры, примерку, доставку.'],
    ['photos','Следить за загрузкой фотосессии','photo_cycle.py: 10 кадров на товар, проверка 10/10 и заливка на GitHub Pages.'],
    ['feed','Проверка связки каждое утро','python avito_bundle.py --telegram — профили, фиды, автозагрузка, мост, Telegram.'],
    ['reports','Включить почту отчётов в кабинете','Сейчас записано eduard=episk@mail.ru — похоже на опечатку.'],
    ['windows','Окна: включить загрузку по ссылке','Профиль окон не обновлялся с 10.11 — включить в кабинете, URL уже feed/avito.xml.'],
  ];
  const key='garderob_tasks';
  const done=JSON.parse(localStorage.getItem(key)||'{}');
  const items=base.map(([id,t,d])=>`<label class="task ${done[id]?'done':''}" data-id="${id}">
      <input type="checkbox" ${done[id]?'checked':''}><div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div></label>`).join('');

  const p1=D.ads.filter(a=>a.priority==='P1');
  const perAd=p1.slice(0,15).map(a=>`<div class="task"><input type="checkbox"><div><div class="t">${esc(a.sku)} · ${esc(a.title)}</div>
      <div class="d">${esc((a.issues||[])[0]||'')} ${a.new_title? '<br>→ '+esc(a.new_title):''}</div></div></div>`).join('');

  $('#tasks').innerHTML = `<div class="grid g2">
      <div class="card"><h3>Чек-лист проекта</h3><div class="tasks">${items}</div>
        <p class="hint">Отметки хранятся в браузере. Ежедневный отчёт приходит в Telegram в 09:20.</p></div>
      <div class="card"><h3>Ближайшие 15 задач по объявлениям (P1)</h3><div class="tasks">${perAd||'<p class="muted">нет</p>'}</div></div>
    </div>`;
  $('#tasks').querySelectorAll('.task[data-id]').forEach(el=>{
    const cb=el.querySelector('input'); const id=el.dataset.id;
    cb.onchange=()=>{ done[id]=cb.checked; localStorage.setItem(key,JSON.stringify(done)); el.classList.toggle('done',cb.checked); };
  });
})();

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;padding:30px;overflow:auto">
  <div style="max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px">
    <div class="flex" style="justify-content:space-between">
      <h3 id="m-title" style="margin:0;font-size:15px"></h3>
      <button class="btn" onclick="closeEdit()">✕</button>
    </div>
    <div id="m-tips" style="margin:12px 0"></div>
    <label class="muted" style="font-size:12px">Заголовок (до 50 символов)</label>
    <input id="m-t" style="width:100%;margin:4px 0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px">
    <label class="muted" style="font-size:12px">Описание</label>
    <textarea id="m-d" rows="9" style="width:100%;margin:4px 0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font:13px/1.5 inherit"></textarea>
    <label class="muted" style="font-size:12px">Цена, ₽</label>
    <input id="m-p" type="number" style="width:160px;margin:4px 0 12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px">
    <div class="flex">
      <button class="btn pri" onclick="applyEdit()">🚀 Применить в фид и Авито</button>
      <button class="btn" onclick="closeEdit()">Отмена</button>
      <span class="muted" id="m-status"></span>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8765';
const st = $('#a-status');
fetch(API + '/api/health', {cache:'no-store'}).then(r=>r.json()).then(()=>{ st.innerHTML = '<span class="dot" style="background:var(--ok)"></span>сервер управления подключён'; })
  .catch(()=>{ st.innerHTML = '<span class="dot" style="background:var(--bad)"></span>сервер не запущен — кнопки работают только локально: <code>python dashboard_server.py</code>'; });

$('#a-check').onclick = async () => {
  st.textContent = 'проверяю…';
  try {
    const r = await fetch(API + '/api/check', {method:'POST'});
    const d = await r.json();
    const ok = !d.problems.length;
    st.innerHTML = (ok?'<span class="dot" style="background:var(--ok)"></span>всё зелёное':'<span class="dot" style="background:var(--warn)"></span>'+esc(d.problems.join('; '))) +
      ` · профиль: ${d.profiles.clothes?.active||0}/${d.profiles.clothes?.ads||0} · фото: ${d.photos['товаров с пакетом']}/${d.photos['всего товаров']}`;
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-sys').onclick = async () => {
  const box = $('#sys');
  box.style.display = 'block';
  box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">проверяю: сервисы, API, фиды, фото, автозагрузка, Telegram, доступ к веб-Авито…</p>';
  st.textContent = 'проверка всех систем…';
  try {
    const d = await (await fetch(API + '/api/syscheck', {method:'POST'})).json();
    if (d.error) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">'+esc(d.error)+'</p>'; return; }
    const bad = d.rows.filter(r=>!r.ok);
    box.innerHTML = `<h3>Проверка всех систем · ${esc(d.time)}</h3>` +
      `<table><thead><tr><th>Система</th><th>Состояние</th><th>Что сделать</th></tr></thead><tbody>` +
      d.rows.map(r=>`<tr class="row"><td>${esc(r.name)}</td>
        <td><span class="tag ${r.ok?'ok':(r.critical?'bad':'warn')}">${r.ok?'ок':(r.critical?'сбой':'внимание')}</span> ${esc(r.detail)}</td>
        <td class="muted">${r.ok?'—':esc(r.fix||'')}</td></tr>`).join('') +
      '</tbody></table>';
    st.innerHTML = bad.length ? `<span class="dot" style="background:var(--warn)"></span>требует внимания: ${bad.length}` 
      : '<span class="dot" style="background:var(--ok)"></span>все системы в порядке';
    if (bad.some(r=>r.name.includes('веб-Авито'))) {
      box.innerHTML += `<p class="hint" style="margin-top:10px">🔒 Авито блокирует IP по защите Qrator. Пока VPN с российским узлом не включён, рыночные данные берутся из последнего успешного снятия (${esc(D.meta.built||'—')}). Как только доступ появится — авто-крон снимет выдачу сам.</p>`;
    }
  } catch(e) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">сервер не отвечает — запустите <code>python dashboard_server.py</code></p>'; }
};
$('#a-market').onclick = async () => {
  st.textContent = 'пробую снять выдачу Авито…';
  try {
    const r = await fetch(API + '/api/refresh-market', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>рынок обновлён'
      : '<span class="dot" style="background:var(--bad)"></span>' + esc(d.error||'не удалось');
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-rebuild').onclick = async () => {
  st.textContent = 'пересобираю…';
  try {
    const r = await fetch(API + '/api/rebuild', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>пересобрано, обновите страницу' : 'ошибка сборки';
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};

let editing = null;
window.openEdit = async sku => {
  editing = sku;
  $('#modal').style.display='block';
  $('#m-title').textContent = 'Правка объявления ' + sku;
  $('#m-status').textContent = 'загружаю подсказки…';
  try {
    const d = await (await fetch(API + '/api/suggest?sku=' + encodeURIComponent(sku))).json();
    $('#m-t').value = d.title || '';
    $('#m-d').value = d.description || '';
    $('#m-p').value = d.price || '';
    $('#m-tips').innerHTML = (d.tips||[]).map(t=>`<div class="task"><div><div class="d">💡 ${esc(t)}</div></div></div>`).join('');
    $('#m-status').textContent = d.old_title ? `было: «${d.old_title}» · ${d.old_price} ₽` : '';
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает — запустите python dashboard_server.py'; }
};
window.closeEdit = () => { $('#modal').style.display='none'; };
window.applyEdit = async () => {
  $('#m-status').textContent = 'применяю…';
  try {
    const r = await fetch(API + '/api/apply', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sku: editing, title: $('#m-t').value, description: $('#m-d').value, price: $('#m-p').value})});
    const d = await r.json();
    $('#m-status').textContent = d.ok ? `применено: ${d.changed.join(', ')} · автозагрузка: ${d.upload}` : ('ошибка: ' + (d.error||''));
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает'; }
};
</script>
</body>
</html>
