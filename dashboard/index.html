  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-sys').onclick = async () => {
  const box = $('#sys');
  box.style.display = 'block';
  box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">проверяю: сервисы, API, фиды, фото, автозагрузка, Telegram, доступ к веб-Авито…</p>';
  st.textContent = 'проверка всех систем…';
  try {
    const d = await (await fetch(API + '/api/syscheck', {method:'POST'})).json();
    if (d.error) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">'+esc(d.error)+'</p>'; return; }
    const bad = d.rows.filter(r=>!r.ok);
    box.innerHTML = `<h3>Проверка всех систем · ${esc(d.time)}</h3>` +
      `<table><thead><tr><th>Система</th><th>Состояние</th><th>Что сделать</th></tr></thead><tbody>` +
      d.rows.map(r=>`<tr class="row"><td>${esc(r.name)}</td>
        <td><span class="tag ${r.ok?'ok':(r.critical?'bad':'warn')}">${r.ok?'ок':(r.critical?'сбой':'внимание')}</span> ${esc(r.detail)}</td>
        <td class="muted">${r.ok?'—':esc(r.fix||'')}</td></tr>`).join('') +
      '</tbody></table>';
    st.innerHTML = bad.length ? `<span class="dot" style="background:var(--warn)"></span>требует внимания: ${bad.length}` 
      : '<span class="dot" style="background:var(--ok)"></span>все системы в порядке';
    if (bad.some(r=>r.name.includes('веб-Авито'))) {
      box.innerHTML += `<p class="hint" style="margin-top:10px">🔒 Авито блокирует IP по защите Qrator. Пока VPN с российским узлом не включён, рыночные данные берутся из последнего успешного снятия (${esc(D.meta.built||'—')}). Как только доступ появится — авто-крон снимет выдачу сам.</p>`;
    }
  } catch(e) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">сервер не отвечает — запустите <code>python dashboard_server.py</code></p>'; }
};
$('#a-market').onclick = async () => {
  st.textContent = 'пробую снять выдачу Авито…';
  try {
    const r = await fetch(API + '/api/refresh-market', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>рынок обновлён'
      : '<span class="dot" style="background:var(--bad)"></span>' + esc(d.error||'не удалось');
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-rebuild').onclick = async () => {
  st.textContent = 'пересобираю…';
  try {
    const r = await fetch(API + '/api/rebuild', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>пересобрано, обновите страницу' : 'ошибка сборки';
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};

let editing = null;
window.openEdit = async sku => {
  editing = sku;
  $('#modal').style.display='block';
  $('#m-title').textContent = 'Правка объявления ' + sku;
  $('#m-status').textContent = 'загружаю подсказки…';
  try {
    const d = await (await fetch(API + '/api/suggest?sku=' + encodeURIComponent(sku))).json();
    $('#m-t').value = d.title || '';
    $('#m-d').value = d.description || '';
    $('#m-p').value = d.price || '';
    $('#m-tips').innerHTML = (d.tips||[]).map(t=>`<div class="task"><div><div class="d">💡 ${esc(t)}</div></div></div>`).join('');
    $('#m-status').textContent = d.old_title ? `было: «${d.old_title}» · ${d.old_price} ₽` : '';
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает — запустите python dashboard_server.py'; }
};
window.closeEdit = () => { $('#modal').style.display='none'; };
window.applyEdit = async () => {
  $('#m-status').textContent = 'применяю…';
  try {
    const r = await fetch(API + '/api/apply', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sku: editing, title: $('#m-t').value, description: $('#m-d').value, price: $('#m-p').value})});
    const d = await r.json();
    $('#m-status').textContent = d.ok ? `применено: ${d.changed.join(', ')} · автозагрузка: ${d.upload}` : ('ошибка: ' + (d.error||''));
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает'; }
};
</script>
