  const items=base.map(([id,t,d])=>`<label class="task ${done[id]?'done':''}" data-id="${id}">
      <input type="checkbox" ${done[id]?'checked':''}><div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div></label>`).join('');

  const p1=D.ads.filter(a=>a.priority==='P1');
  const perAd=p1.slice(0,15).map(a=>`<div class="task"><input type="checkbox"><div><div class="t">${esc(a.sku)} · ${esc(a.title)}</div>
      <div class="d">${esc((a.issues||[])[0]||'')} ${a.new_title? '<br>→ '+esc(a.new_title):''}</div></div></div>`).join('');

  $('#tasks').innerHTML = `<div class="grid g2">
      <div class="card"><h3>Чек-лист проекта</h3><div class="tasks">${items}</div>
        <p class="hint">Отметки хранятся в браузере. Ежедневный отчёт приходит в Telegram в 09:20.</p></div>
      <div class="card"><h3>Ближайшие 15 задач по объявлениям (P1)</h3><div class="tasks">${perAd||'<p class="muted">нет</p>'}</div></div>
    </div>`;
  $('#tasks').querySelectorAll('.task[data-id]').forEach(el=>{
    const cb=el.querySelector('input'); const id=el.dataset.id;
    cb.onchange=()=>{ done[id]=cb.checked; localStorage.setItem(key,JSON.stringify(done)); el.classList.toggle('done',cb.checked); };
  });
})();

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;padding:30px;overflow:auto">
  <div style="max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px">
    <div class="flex" style="justify-content:space-between">
      <h3 id="m-title" style="margin:0;font-size:15px"></h3>
      <button class="btn" onclick="closeEdit()">✕</button>
    </div>
    <div id="m-tips" style="margin:12px 0"></div>
    <label class="muted" style="font-size:12px">Заголовок (до 50 символов)</label>
    <input id="m-t" style="width:100%;margin:4px 0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px">
    <label class="muted" style="font-size:12px">Описание</label>
    <textarea id="m-d" rows="9" style="width:100%;margin:4px 0 10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font:13px/1.5 inherit"></textarea>
    <label class="muted" style="font-size:12px">Цена, ₽</label>
    <input id="m-p" type="number" style="width:160px;margin:4px 0 12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px">
    <div class="flex">
      <button class="btn pri" onclick="applyEdit()">🚀 Применить в фид и Авито</button>
      <button class="btn" onclick="closeEdit()">Отмена</button>
      <span class="muted" id="m-status"></span>
    </div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8765';
const st = $('#a-status');
fetch(API + '/api/health', {cache:'no-store'}).then(r=>r.json()).then(()=>{ st.innerHTML = '<span class="dot" style="background:var(--ok)"></span>сервер управления подключён'; })
  .catch(()=>{ st.innerHTML = '<span class="dot" style="background:var(--bad)"></span>сервер не запущен — кнопки работают только локально: <code>python dashboard_server.py</code>'; });

$('#a-check').onclick = async () => {
  st.textContent = 'проверяю…';
  try {
    const r = await fetch(API + '/api/check', {method:'POST'});
    const d = await r.json();
    const ok = !d.problems.length;
    st.innerHTML = (ok?'<span class="dot" style="background:var(--ok)"></span>всё зелёное':'<span class="dot" style="background:var(--warn)"></span>'+esc(d.problems.join('; '))) +
      ` · профиль: ${d.profiles.clothes?.active||0}/${d.profiles.clothes?.ads||0} · фото: ${d.photos['товаров с пакетом']}/${d.photos['всего товаров']}`;
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-sys').onclick = async () => {
  const box = $('#sys');
  box.style.display = 'block';
  box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">проверяю: сервисы, API, фиды, фото, автозагрузка, Telegram, доступ к веб-Авито…</p>';
  st.textContent = 'проверка всех систем…';
  try {
    const d = await (await fetch(API + '/api/syscheck', {method:'POST'})).json();
    if (d.error) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">'+esc(d.error)+'</p>'; return; }
    const bad = d.rows.filter(r=>!r.ok);
    box.innerHTML = `<h3>Проверка всех систем · ${esc(d.time)}</h3>` +
      `<table><thead><tr><th>Система</th><th>Состояние</th><th>Что сделать</th></tr></thead><tbody>` +
      d.rows.map(r=>`<tr class="row"><td>${esc(r.name)}</td>
        <td><span class="tag ${r.ok?'ok':(r.critical?'bad':'warn')}">${r.ok?'ок':(r.critical?'сбой':'внимание')}</span> ${esc(r.detail)}</td>
        <td class="muted">${r.ok?'—':esc(r.fix||'')}</td></tr>`).join('') +
      '</tbody></table>';
    st.innerHTML = bad.length ? `<span class="dot" style="background:var(--warn)"></span>требует внимания: ${bad.length}` 
      : '<span class="dot" style="background:var(--ok)"></span>все системы в порядке';
    if (bad.some(r=>r.name.includes('веб-Авито'))) {
      box.innerHTML += `<p class="hint" style="margin-top:10px">🔒 Авито блокирует IP по защите Qrator. Пока VPN с российским узлом не включён, рыночные данные берутся из последнего успешного снятия (${esc(D.meta.built||'—')}). Как только доступ появится — авто-крон снимет выдачу сам.</p>`;
    }
  } catch(e) { box.innerHTML = '<h3>Проверка всех систем</h3><p class="hint">сервер не отвечает — запустите <code>python dashboard_server.py</code></p>'; }
};
$('#a-market').onclick = async () => {
  st.textContent = 'пробую снять выдачу Авито…';
  try {
    const r = await fetch(API + '/api/refresh-market', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>рынок обновлён'
      : '<span class="dot" style="background:var(--bad)"></span>' + esc(d.error||'не удалось');
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};
$('#a-rebuild').onclick = async () => {
  st.textContent = 'пересобираю…';
  try {
    const r = await fetch(API + '/api/rebuild', {method:'POST'});
    const d = await r.json();
    st.innerHTML = d.ok ? '<span class="dot" style="background:var(--ok)"></span>пересобрано, обновите страницу' : 'ошибка сборки';
  } catch(e){ st.textContent = 'сервер не отвечает'; }
};

let editing = null;
window.openEdit = async sku => {
  editing = sku;
  $('#modal').style.display='block';
  $('#m-title').textContent = 'Правка объявления ' + sku;
  $('#m-status').textContent = 'загружаю подсказки…';
  try {
    const d = await (await fetch(API + '/api/suggest?sku=' + encodeURIComponent(sku))).json();
    $('#m-t').value = d.title || '';
    $('#m-d').value = d.description || '';
    $('#m-p').value = d.price || '';
    $('#m-tips').innerHTML = (d.tips||[]).map(t=>`<div class="task"><div><div class="d">💡 ${esc(t)}</div></div></div>`).join('');
    $('#m-status').textContent = d.old_title ? `было: «${d.old_title}» · ${d.old_price} ₽` : '';
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает — запустите python dashboard_server.py'; }
};
window.closeEdit = () => { $('#modal').style.display='none'; };
window.applyEdit = async () => {
  $('#m-status').textContent = 'применяю…';
  try {
    const r = await fetch(API + '/api/apply', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sku: editing, title: $('#m-t').value, description: $('#m-d').value, price: $('#m-p').value})});
    const d = await r.json();
    $('#m-status').textContent = d.ok ? `применено: ${d.changed.join(', ')} · автозагрузка: ${d.upload}` : ('ошибка: ' + (d.error||''));
  } catch(e){ $('#m-status').textContent = 'сервер не отвечает'; }
};
</script>
</body>
</html>
